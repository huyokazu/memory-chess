services:
  - type: web
    name: memory-chess
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_WEB
        value: "true"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: MAX_BOT_GAMES
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
